name: Publish

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write
  security-events: write

jobs:
  ci:
    uses: $/.github/workflows/ci.yaml
    with:
      publish-preview: true

  publish-packages:
    needs: ci

    runs-on: ubuntu-latest

    environment:
      name: npm
      url: https://www.npmjs.com/org/todone

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: $/.github/actions/setup
        with: { yarn: false }

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: ./tarballs

      - name: Publish changed packages
        run: |
          for file in ./tarballs/*; do
            mise x npm:npm -- npm publish $file || true
          done

  publish-docs:
    needs: ci

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      pages: write

    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
