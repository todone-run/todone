name: Check merge queue

on:
  merge_group:

permissions:
  contents: read
  security-events: write

jobs:
  ci:
    uses: $/.github/workflows/ci.yaml

  conventional-commits:
    runs-on: ubuntu-latest
    steps:
      - uses: $/.github/actions/setup

      - name: Check commit titles are conventional commits
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          # The checkout is shallow, so get the commit titles from the API instead of git
          titles=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE_SHA...$HEAD_SHA" --jq '.commits[].commit.message | split("\n")[0]')
          failed=0
          while IFS= read -r title; do
            echo "$title" | yarn commitlint --verbose || failed=1
          done <<< "$titles"
          exit "$failed"

  pass:
    runs-on: ubuntu-latest
    needs: [ci, conventional-commits]
    if: always()
    env:
      RESULTS: ${{ toJSON(needs.*.result) }}
    steps:
      - run: jq -e 'all(. == "success")' <<< "$RESULTS"
