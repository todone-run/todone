name: Run Todone

on:
  workflow_dispatch:
    inputs:
      dry-run:
        type: boolean
        description: Run the action in dry-run mode
        required: false
        default: false
  workflow_call:
    inputs:
      dry-run:
        type: boolean
        description: Run the action in dry-run mode
        required: false
        default: false
  schedule:
    - cron: "32 18 * * *" # Every day at a chosen random time
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-run:
    runs-on: ubuntu-latest

    steps:
      - uses: $/.github/actions/setup

      - name: Build action
        run: yarn nx run-many -t build

      - name: Link binary
        run: yarn

      - name: Run todone
        env:
          NODE_OPTIONS: "--enable-source-maps"
          GITHUB_TOKEN: ${{ github.token }}
        uses: ./packages/github-action # zizmor: ignore[self-repository]
        with:
          dry-run: ${{ github.event.inputs.dry-run || false}}
